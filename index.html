<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شگف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════
       SHAGAF LANDING PAGE — YOUTUBE REDIRECTOR
       ───────────────────────────────────────────────────
       TO UPDATE YOUTUBE LINKS:
       Find the `ziarats` object in the <script> below.
       Each entry has a `youtube` field.
       Replace any 'PLACEHOLDER_...' value with the
       real YouTube URL, e.g.:
       youtube: 'https://www.youtube.com/watch?v=XXXXXXXXXXX'
    ═══════════════════════════════════════════════════ */

    :root {
      --ink:        #0b0b0b;
      --paper:      #f2ece0;
      --gold:       #c9a84c;
      --gold-dim:   #8a6f2e;
      --mist:       #c8bfad;
      --red:        #7d1a0f;
      --card-bg:    rgba(255,255,255,0.03);
      --border:     rgba(201,168,76,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      overflow-x: hidden;
    }

    /* ── Ambient background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(201,168,76,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(125,26,15,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Grain ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
    }

    .stage {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Calligraphic rule ── */
    .rule {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeIn 1s 0.1s ease forwards;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3rem, 14vw, 5rem);
      letter-spacing: 0.22em;
      color: var(--paper);
      direction: ltr;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1s 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .wordmark em {
      font-style: normal;
      color: var(--gold);
    }

    .subtitle {
      margin-top: 10px;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--mist);
      opacity: 0;
      direction: ltr;
      animation: fadeUp 1s 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ── Ziara name ── */
    .ziara-name {
      margin-top: 48px;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 400;
      color: var(--paper);
      text-align: center;
      line-height: 1.5;
      opacity: 0;
      animation: fadeUp 1s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .ziara-label {
      margin-top: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ── Divider ── */
    .divider {
      width: 40px; height: 1px;
      background: var(--gold);
      margin: 28px auto;
      opacity: 0;
      animation: fadeIn 1s 0.7s ease forwards;
    }

    /* ── Body text ── */
    .body-text {
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.85;
      color: var(--mist);
      text-align: center;
      max-width: 340px;
      opacity: 0;
      animation: fadeUp 1s 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ── CTA Button ── */
    .cta-wrap {
      margin-top: 36px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 1s 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: var(--gold);
      color: var(--ink);
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 0.2s, transform 0.15s;
      cursor: pointer;
      border: none;
    }
    .cta-btn:hover { opacity: 0.88; }
    .cta-btn:active { transform: scale(0.98); }

    .cta-btn svg { flex-shrink: 0; }

    /* ── Not found state ── */
    .not-found {
      margin-top: 36px;
      padding: 20px 24px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-size: 0.85rem;
      color: var(--mist);
      text-align: center;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 1s 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
      display: none;
    }

    /* ── Default state (no ziarat param) ── */
    .default-state {
      margin-top: 36px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
      display: none;
    }
    .default-state p {
      font-size: 0.88rem;
      color: var(--mist);
      line-height: 1.7;
    }

    /* ── Footer ── */
    footer {
      margin-top: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: fadeIn 1s 1.1s ease forwards;
    }
    .footer-text {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mist);
      opacity: 0.35;
      direction: ltr;
    }
    .footer-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.4;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
<div class="stage">

  <div class="rule"></div>

  <div class="wordmark">SHA<em>G</em>AF</div>
  <div class="subtitle">Shagaf Library</div>

  <div class="ziara-name" id="ziaraName"></div>
  <div class="ziara-label" id="ziaraLabel"></div>
  <div class="divider" id="divider" style="display:none"></div>
  <p class="body-text" id="bodyText"></p>

  <div class="cta-wrap" id="ctaWrap" style="display:none">
    <a href="#" class="cta-btn" id="ctaBtn" target="_blank" rel="noopener">
      <!-- YouTube icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
      <span id="ctaLabel">شاهد على يوتيوب</span>
    </a>
  </div>

  <div class="not-found" id="notFound">
    هذه الزيارة غير متوفرة حالياً على يوتيوب.<br>
    تابعونا للمزيد قريباً.
  </div>

  <div class="default-state" id="defaultState">
    <p>مرحباً بكم في مكتبة شگف.<br>اختر زيارة من التطبيق للاستماع.</p>
  </div>

  <footer>
    <span class="footer-text">Shagaf Library</span>
    <div class="footer-dot"></div>
    <span class="footer-text">2025</span>
  </footer>

</div>

<script>
  // ═══════════════════════════════════════════════════════════════
  // YOUTUBE LINKS CONFIG
  // ───────────────────────────────────────────────────────────────
  // To update a link: replace the youtube value with the full URL.
  // To add a new ziarat: add a new entry following the same format.
  // Placeholder format: 'PLACEHOLDER_[ID]' — search for these to
  // find which ones still need a real YouTube link.
  // ═══════════════════════════════════════════════════════════════
  const ziarats = {
    'ziarat-warith': {
      name: 'زيارة وارث',
      youtube: 'https://youtu.be/F3qqYPijPOQ?si=WXD3btUCnrYBqK7_',
    },
    'ziarat-ashura': {
      name: 'زيارة عاشوراء',
      youtube: 'https://youtu.be/Pemk3vs4iAI?si=7CtRW332hN3cwRig',
    },
    'ziarat-al-yassin': {
      name: 'زيارة آل ياسين',
      youtube: 'https://youtu.be/5CWBQ_6S5h8?feature=shared',
    },
    'ziarat-al-rasool': {
      name: 'زيارة الرسول الأعظم',
      youtube: 'https://youtu.be/9OS5abPp4eM?si=7V4G4Yt9h5yplb5T',
    },
    'ziarat-amin-allah': {
      name: 'زيارة أمين الله',
      youtube: 'https://youtu.be/Re5dd8hGfVc?si=VHFFNIniTd7Wtv7L',
    },
    'ziarat-al-arbaeen': {
      name: 'زيارة الأربعين',
      youtube: 'https://youtu.be/IQdltrBP0_E?si=8VSNqnPnhvQedSAu',
    },
    'ziarat-fatima-al-zahra': {
      name: 'زيارة فاطمة الزهراء',
      youtube: 'https://youtu.be/45UQYs5jQ78?si=qfz0T60GqR1PVyWU',
    },
    'ziarat-abi-al-fazl': {
      name: 'زيارة أبي الفضل',
      youtube: 'https://youtu.be/af9ruj2861M?si=u9TR076rO69XJZws',
    },
    'ziarat-umm-al-banin': {
      name: 'زيارة أم البنين',
      youtube: 'https://youtu.be/HB0jhVQZbkU?si=Bp3BY2BZ0NNQ5BN7',
    },
    'ziarat-ali-al-akbar': {
      name: 'زيارة علي الأكبر',
      youtube: 'https://youtu.be/07iIj3v9BFI?si=GoaLHeAKUpOVMGCr',
    },
    'ziarat-habib-ibn-muzahir': {
      name: 'زيارة حبيب بن مظاهر',
      youtube: 'PLACEHOLDER_ZIARAT_HABIB_IBN_MUZAHIR',
    },
    'ziarat-al-shuhada': {
      name: 'زيارة الشهداء',
      youtube: 'PLACEHOLDER_ZIARAT_AL_SHUHADA',
    },
    'ziarat-ahl-al-qubur': {
      name: 'زيارة أهل القبور',
      youtube: 'PLACEHOLDER_ZIARAT_AHL_AL_QUBUR',
    },
  };
  // ═══════════════════════════════════════════════════════════════

  const params  = new URLSearchParams(window.location.search);
  const id      = params.get('ziarat');
  const ziara   = id ? ziarats[id] : null;

  const nameEl    = document.getElementById('ziaraName');
  const labelEl   = document.getElementById('ziaraLabel');
  const divider   = document.getElementById('divider');
  const bodyEl    = document.getElementById('bodyText');
  const ctaWrap   = document.getElementById('ctaWrap');
  const ctaBtn    = document.getElementById('ctaBtn');
  const ctaLabel  = document.getElementById('ctaLabel');
  const notFound  = document.getElementById('notFound');
  const defState  = document.getElementById('defaultState');

  if (!id) {
    // No ziarat param — show default welcome state
    defState.style.display = 'block';

  } else if (!ziara) {
    // Unknown ziarat ID
    nameEl.textContent  = 'زيارة غير معروفة';
    divider.style.display = 'block';
    bodyEl.textContent  = 'لم نتمكن من العثور على هذه الزيارة.';
    notFound.style.display = 'block';

  } else {
    // Known ziarat — show name and CTA
    nameEl.textContent  = ziara.name;
    labelEl.textContent = 'استمع الآن';
    divider.style.display = 'block';

    const hasYoutube = ziara.youtube && !ziara.youtube.startsWith('PLACEHOLDER');

    if (hasYoutube) {
      bodyEl.textContent = 'اضغط على الزر أدناه للاستماع على يوتيوب.';
      ctaBtn.href        = ziara.youtube;
      ctaWrap.style.display = 'block';
    } else {
      bodyEl.textContent = 'هذه الزيارة ستكون متاحة على يوتيوب قريباً.';
      notFound.style.display = 'block';
    }
  }
</script>
</body>
</html>
