<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شگف | جاري التحويل...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0b0b; --paper: #f2ece0; --gold: #c9a84c; --mist: #c8bfad;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink); color: var(--paper); font-family: 'Tajawal', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 24px;
    }
    .stage { width: 100%; max-width: 480px; text-align: center; }
    .wordmark { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: var(--paper); margin-bottom: 20px; }
    .ziara-name { font-size: 1.5rem; margin-bottom: 10px; }
    .body-text { color: var(--mist); margin-bottom: 30px; }
    .cta-btn { 
      display: inline-block; padding: 15px 30px; background: var(--gold); 
      color: var(--ink); text-decoration: none; font-weight: bold; border-radius: 2px;
    }
  </style>
</head>
<body>
<div class="stage">
  <div class="wordmark">SHA<em>G</em>AF</div>
  <div class="ziara-name" id="ziaraName">جاري التحميل...</div>
  <p class="body-text" id="bodyText">يرجى الانتظار، سيتم تحويلك إلى يوتيوب...</p>
  
  <div id="manualRedirect" style="display:none;">
    <a href="#" class="cta-btn" id="ctaBtn" target="_blank" rel="noopener noreferrer">اضغط هنا إذا لم يتم تحويلك</a>
  </div>
</div>

<script>
  const ziarats = {
    'ziarat-warith': {
      name: 'زيارة وارث',
      youtube: 'https://youtu.be/F3qqYPijPOQ?si=WXD3btUCnrYBqK7_',
    },
    'ziarat-ashura': {
      name: 'زيارة عاشوراء',
      youtube: 'https://youtu.be/Pemk3vs4iAI?si=7CtRW332hN3cwRig',
    },
    'ziarat-al-yassin': {
      name: 'زيارة آل ياسين',
      youtube: 'https://youtu.be/5CWBQ_6S5h8?feature=shared',
    },
    'ziarat-al-rasool': {
      name: 'زيارة الرسول الأعظم',
      youtube: 'https://youtu.be/9OS5abPp4eM?si=7V4G4Yt9h5yplb5T',
    },
    'ziarat-amin-allah': {
      name: 'زيارة أمين الله',
      youtube: 'https://youtu.be/Re5dd8hGfVc?si=VHFFNIniTd7Wtv7L',
    },
    'ziarat-al-arbaeen': {
      name: 'زيارة الأربعين',
      youtube: 'https://youtu.be/IQdltrBP0_E?si=8VSNqnPnhvQedSAu',
    },
    'ziarat-fatima-al-zahra': {
      name: 'زيارة فاطمة الزهراء',
      youtube: 'https://youtu.be/45UQYs5jQ78?si=qfz0T60GqR1PVyWU',
    },
    'ziarat-abi-al-fazl': {
      name: 'زيارة أبي الفضل',
      youtube: 'https://youtu.be/af9ruj2861M?si=u9TR076rO69XJZws',
    },
    'ziarat-umm-al-banin': {
      name: 'زيارة أم البنين',
      youtube: 'https://youtu.be/HB0jhVQZbkU?si=Bp3BY2BZ0NNQ5BN7',
    },
    'ziarat-ali-al-akbar': {
      name: 'زيارة علي الأكبر',
      youtube: 'https://youtu.be/07iIj3v9BFI?si=GoaLHeAKUpOVMGCr',
    },
    'ziarat-habib-ibn-muzahir': {
      name: 'زيارة حبيب بن مظاهر',
      youtube: 'PLACEHOLDER_ZIARAT_HABIB_IBN_MUZAHIR',
    },
    'ziarat-al-shuhada': {
      name: 'زيارة الشهداء',
      youtube: 'PLACEHOLDER_ZIARAT_AL_SHUHADA',
    },
    'ziarat-ahl-al-qubur': {
      name: 'زيارة أهل القبور',
      youtube: 'PLACEHOLDER_ZIARAT_AHL_AL_QUBUR',
    },
  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get('ziarat');
  const ziara = id ? ziarats[id] : null;

  if (ziara && ziara.youtube && !ziara.youtube.startsWith('PLACEHOLDER')) {
    document.getElementById('ziaraName').textContent = ziara.name;
    
    // Auto-redirect after 1.5 seconds
    setTimeout(() => {
      window.location.replace(ziara.youtube);
    }, 1500);

    // Show manual button as backup after 3 seconds
    setTimeout(() => {
      document.getElementById('manualRedirect').style.display = 'block';
      document.getElementById('ctaBtn').href = ziara.youtube;
    }, 3000);
    
  } else {
    document.getElementById('ziaraName').textContent = 'عذراً';
    document.getElementById('bodyText').textContent = 'الرابط غير متوفر أو غير صحيح.';
  }
</script>
</body>
</html>
